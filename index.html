<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickle Cat — Laser Edition</title>
<style>
* { margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; cursor: crosshair; touch-action: none; -webkit-user-select: none; user-select: none; }
canvas { display: block; }
#hud {
  position: fixed; top: 16px; right: 20px;
  color: rgba(255, 60, 60, 0.9); font-family: monospace; font-size: clamp(14px, 1.6vmin, 32px); font-weight: bold;
  text-shadow: 0 0 10px rgba(255,60,60,0.8); pointer-events: none; letter-spacing: 2px; z-index: 10;
}
#hint {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  color: rgba(255,200,100,0.55); font-family: monospace; font-size: clamp(12px, 1.3vmin, 26px);
  letter-spacing: 3px; pointer-events: none; z-index: 10;
  animation: fadehint 3s ease 2s forwards;
}
#credit {
  line-height: 1.5;
  position: fixed; z-index: 10; font-family: monospace; letter-spacing: 1px;
  color: rgba(255,255,255,0.45); text-shadow: 0 0 6px rgba(0,0,0,0.9);
}
#credit a { color: inherit; text-decoration: none; }
#credit a:hover, #credit a:focus-visible { color: #fff; text-decoration: underline; }
#error {
  display: none; position: fixed; z-index: 20; top: 50%; left: 50%;
  transform: translate(-50%, -50%); max-width: 80vw; padding: 20px 28px;
  background: rgba(0,0,0,0.85); border: 1px solid rgba(255,60,60,0.8);
  color: #ff8a8a; font-family: monospace; font-size: 16px; line-height: 1.5; text-align: center;
}
@keyframes fadehint { to { opacity: 0; } }
</style>
</head>
<body>
<audio id="song" loop src="assets/audio/interstellar.mp3"></audio>
<div id="hud">☠ PICKLES: <span id="kills">0</span></div>
<div id="credit">remix of <a href="https://dn.ht/picklecat/" target="_blank" rel="noopener">Pickle Cat</a> by Denis Hotson<br>
  built by Jody ·
  <a href="https://jodyvanden.github.io/cv/" target="_blank" rel="noopener">CV</a> ·
  <a href="https://github.com/jodyvanden" target="_blank" rel="noopener">GitHub</a> ·
  <a href="https://www.linkedin.com/in/jodyvandenschrick" target="_blank" rel="noopener">LinkedIn</a></div>
<div id="error" role="alert"></div>
<div id="diag" style="display:none;position:fixed;top:60px;left:10px;z-index:30;color:#0f0;font:12px monospace;white-space:pre;background:rgba(0,0,0,.75);padding:6px"></div>
<div id="hint">⚡ CLICK TO FIRE LASER ⚡</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/3.0.11/pixi.min.js"></script>
<script src="src/eyes.js"></script>
<script src="src/layout.js"></script>
<script src="src/pickles.js"></script>
<script src="src/loaderror.js"></script>
<script src="src/pointer.js"></script>
<script src="src/flags.js"></script>
<script>

function showLoadError(detail) {
  console.error('Pickle Cat failed to load: ' + detail);
  var el = document.getElementById('error');
  el.textContent = loadErrorMessage(location.protocol);
  el.style.display = 'block';
}
if (typeof PIXI === 'undefined') {
  showLoadError('PixiJS did not load');
  throw new Error('PixiJS missing');
}

var flags = parseFlags(location.search);
function dg(msg) {
  if (!flags.debug) return;
  var el = document.getElementById('diag');
  el.style.display = 'block';
  el.textContent += msg + '\n';
}
window.addEventListener('error', function(e) { dg('ERR ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
dg('flags: ' + JSON.stringify(flags) + '  UA: ' + navigator.userAgent);

var song = document.getElementById('song');
song.volume = 0.6;
function startMusic() { var p = song.play(); if (p && p.catch) p.catch(function() {}); }
['pointerup', 'touchend', 'click'].forEach(function(t) { document.addEventListener(t, startMusic); });

// Taps on the credit links must not fire a laser
document.getElementById('credit').addEventListener('pointerdown', function(e) { e.stopPropagation(); });

var w = 1024, h = 768;

// Try canvas renderer as fallback if WebGL fails
var renderer;
try {
  renderer = new PIXI.WebGLRenderer(w, h);
} catch(e) {
  renderer = new PIXI.CanvasRenderer(w, h);
}

document.body.appendChild(renderer.view);
dg('renderer: ' + (renderer instanceof PIXI.WebGLRenderer ? 'WebGL' : 'Canvas'));
if (renderer.gl) {
  var gl = renderer.gl, dbi = gl.getExtension('WEBGL_debug_renderer_info');
  dg('GL: ' + gl.getParameter(gl.VERSION) + ' | ' + (dbi ? gl.getParameter(dbi.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
  dg('MAX_TEXTURE_SIZE: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
}
renderer.view.style.position = 'absolute';
// window.innerWidth/innerHeight grow with the 1024px canvas on phones; the
// document element's client size is the real visible area.
function viewSize() {
  var e = document.documentElement;
  return { w: e.clientWidth, h: e.clientHeight };
}
function layout() {
  var vs = viewSize();
  var r = fitToWindow(vs.w, vs.h, w, h);
  var s = renderer.view.style;
  s.width = r.width + 'px'; s.height = r.height + 'px';
  s.left = r.left + 'px';   s.top = r.top + 'px';
  // keep the HUD inside the game area, sized relative to it
  var hud = document.getElementById('hud').style;
  hud.top = (r.top + r.height * 0.02) + 'px';
  hud.right = (r.left + r.width * 0.02) + 'px';
  var credit = document.getElementById('credit').style;
  credit.left = (r.left + r.width * 0.02) + 'px';
  credit.bottom = (vs.h - r.top - r.height + r.height * 0.02) + 'px';
  credit.fontSize = Math.max(11, r.height * 0.018) + 'px';
  hud.fontSize = Math.max(18, r.height * 0.045) + 'px';
}
layout();
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', layout);

var stage      = new PIXI.Container();
var container  = new PIXI.Container();
var foreground = new PIXI.Container();
var laserLayer = new PIXI.Container();
var fxLayer    = new PIXI.Container();
stage.addChild(container);
stage.addChild(foreground);
stage.addChild(laserLayer);
stage.addChild(fxLayer);

var cat, catd, catf, bg, d1, f1;
var mousex = w/2, mousey = h/2;
var pickles = [], pickleAlive = [], killCount = 0;
var lasers = [], particles = [];


PIXI.loader
  .add('bg',              'assets/images/M3VDxHJ.jpg')
  .add('pickle',          'assets/images/dill-pickle.png')
  .add('cat',             'assets/images/mesmercat.png')
  .add('catdisplacement', 'assets/images/mesmercatdisplacement.jpg')
  .add('displacement',    'assets/images/clouds.jpg')
  .load(function(loader, resources) {


    // BACKGROUND — scale 2.2 so displacement filter never exposes black edges
    bg = new PIXI.Sprite(resources.bg.texture);
    bg.position.x = w / 2;
    bg.position.y = h / 2;
    bg.scale.x = 2.2;
    bg.scale.y = 2.2;
    bg.pivot.x = 943 / 2;
    bg.pivot.y = 584 / 2;
    container.addChild(bg);

    // BG DISPLACEMENT + RGB SPLIT
    d1 = new PIXI.Sprite(resources.displacement.texture);
    f1 = new PIXI.filters.DisplacementFilter(d1, 40);
    d1.scale.x = 2;
    d1.scale.y = 2;
    d1.renderable = false;
    var f2 = new PIXI.filters.RGBSplitFilter();
    f2.red.x = -2; f2.red.y = 2;
    f2.green.x = 0; f2.green.y = 0;
    f2.blue.x = 2;  f2.blue.y = -2;
    if (!flags.off.bg) container.filters = [f2, f1];
    container.addChild(d1);

    // PICKLES
    var shadow = new PIXI.filters.DropShadowFilter();
    shadow.distance = 0;
    shadow.blur = 20;
    for (var i = 0; i < 5; i++) {
      var p = new PIXI.Sprite(resources.pickle.texture);
      p.position.y = Math.random() * 400;
      p.pivot.x = 480 / 2;
      p.pivot.y = 263 / 2;
      p.scale.x = 0.5;
      p.scale.y = 0.5;
      if (!flags.off.pickle) p.filters = [shadow];
      pickles[i] = p;
      pickleAlive[i] = true;
      foreground.addChild(p);
    }

    // CAT
    cat = new PIXI.Sprite(resources.cat.texture);
    cat.pivot.x = 250;
    cat.pivot.y = 320;
    cat.position.x = w / 2;
    cat.position.y = h;
    cat.scale.x = w / 500 * 0.6;
    cat.scale.y = h / 333 * 0.6;
    foreground.addChild(cat);

    // CAT DISPLACEMENT
    catd = new PIXI.Sprite(resources.catdisplacement.texture);
    catf = new PIXI.filters.DisplacementFilter(catd, 0);
    if (!flags.off.cat) cat.filters = [catf];
    cat.addChild(catd);

    // GLOW + DIMMING
    // A stage-wide filter wraps objects that have their own filters; Firefox
    // can't draw nested filters like that and leaves the canvas blank. So dim
    // with a CSS filter instead, and put the bloom only on the laser/explosion
    // layers, which have no filtered children.
    if (!flags.off.stage) {
      renderer.view.style.filter = 'brightness(0.8)';
      try {
        laserLayer.filters = [new PIXI.filters.BloomFilter()];
        fxLayer.filters    = [new PIXI.filters.BloomFilter()];
      } catch(e) {
        console.error('Glow filter unavailable: ' + e.message);
      }
    }

    // Track the pointer for the cat's displacement effect (mouse and touch)
    window.addEventListener('pointermove', function(e) { mousex = e.clientX; mousey = e.clientY; });

    // Fire on pointerdown: PixiJS 3's touch handling calls preventDefault on the
    // canvas, which suppresses the synthesized click on phones and tablets.
    document.addEventListener('pointerdown', function(e) {
      var p = toCanvasPoint(e.clientX, e.clientY, renderer.view.getBoundingClientRect(), w, h);
      if (p) fireLaser(p.x, p.y);
    });

    dg('loaded; starting animate');
    if (flags.debug) setTimeout(runDiagnostics, 2500);
    animate();
  });

PIXI.loader.on('error', function(err) {
  showLoadError(err);
});

function fireLaser(tx, ty) {
  var eyes = getEyePositions(cat);
  eyes.forEach(function(eye, idx) {
    lasers.push({ sx:eye.x, sy:eye.y, tx:tx, ty:ty, eyeIdx:idx,
                  progress:0, speed:0.055, done:false, hit:false });
  });
}

function spawnExplosion(x, y) {
  var sparkColors  = [0xff4400, 0xff8800, 0xffdd00, 0x00ffcc, 0xffffff, 0x88ff00];
  var pickleColors = [0x2d7a2d, 0x48aa48, 0x6ab020];
  for (var i = 0; i < 55; i++) {
    var g = new PIXI.Graphics();
    var col = sparkColors[Math.floor(Math.random()*sparkColors.length)];
    var sz = 2 + Math.random()*7;
    g.beginFill(col);
    Math.random() > 0.4 ? g.drawCircle(0,0,sz) : g.drawRect(-sz/2,-sz/2,sz,sz);
    g.endFill();
    g.position.x = x + (Math.random()-0.5)*15;
    g.position.y = y + (Math.random()-0.5)*15;
    var a = Math.random()*Math.PI*2, spd = 3+Math.random()*10;
    fxLayer.addChild(g);
    particles.push({ g:g, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-2,
                     gravity:0.25, life:1.0, decay:0.016+Math.random()*0.02, spin:(Math.random()-0.5)*0.4 });
  }
  for (var j = 0; j < 14; j++) {
    var cg = new PIXI.Graphics();
    cg.beginFill(pickleColors[Math.floor(Math.random()*pickleColors.length)]);
    cg.drawRoundedRect(-4,-10,8,20,3); cg.endFill();
    cg.position.x = x; cg.position.y = y;
    cg.scale.x = cg.scale.y = 0.4+Math.random()*0.7;
    var a2 = Math.random()*Math.PI*2, s2 = 4+Math.random()*8;
    fxLayer.addChild(cg);
    particles.push({ g:cg, vx:Math.cos(a2)*s2, vy:Math.sin(a2)*s2-5,
                     gravity:0.3, life:1.0, decay:0.012+Math.random()*0.012, spin:(Math.random()-0.5)*0.5 });
  }
  for (var r = 0; r < 3; r++) {
    (function(ri) {
      var rg = new PIXI.Graphics();
      rg.lineStyle(3-ri, ri===0?0xffdd00:ri===1?0xff8800:0xff4400, 1);
      rg.drawCircle(0,0,10+ri*5); rg.position.x = x; rg.position.y = y;
      fxLayer.addChild(rg);
      particles.push({ g:rg, vx:0, vy:0, gravity:0, life:1.0, decay:0.03+ri*0.01, spin:0, _ring:true, _delay:ri*4 });
    })(r);
  }
  var fl = new PIXI.Graphics();
  fl.beginFill(0xffffff,0.85); fl.drawCircle(0,0,40); fl.endFill();
  fl.position.x = x; fl.position.y = y;
  fxLayer.addChild(fl);
  particles.push({ g:fl, vx:0, vy:0, gravity:0, life:1.0, decay:0.12, spin:0, _flash:true });
}

function checkHit(lx, ly) {
  for (var i = 0; i < pickles.length; i++) {
    if (!pickleAlive[i]) continue;
    var p = pickles[i];
    var dx = lx - p.position.x, dy = ly - p.position.y;
    if (Math.sqrt(dx*dx+dy*dy) < 55) {
      pickleAlive[i] = false;
      foreground.removeChild(p);
      spawnExplosion(p.position.x, p.position.y);
      killCount++;
      document.getElementById('kills').textContent = killCount;
      (function(idx) {
        setTimeout(function() {
          pickles[idx].alpha = 0;
          foreground.addChild(pickles[idx]);
        }, 1500 + Math.random()*1500);
      })(i);
      return true;
    }
  }
  return false;
}

// ?debug: render each part alone and count the pixels it draws, so a blank
// canvas on some browser/GPU can be traced to the exact filter at fault.
function runDiagnostics() {
  var gl = renderer.gl;
  if (!gl) { dg('diag: Canvas renderer (no WebGL)'); return; }
  var buf = new Uint8Array(w * h * 4);
  function drawn() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    var n = 0;
    for (var i = 0; i < buf.length; i += 4) { if (buf[i] + buf[i+1] + buf[i+2] > 30) n++; }
    return Math.round(100 * n / (w * h)) + '%';
  }
  function trial(name, setup, teardown) {
    while (gl.getError() !== gl.NO_ERROR) {}
    var saved = [container.visible, foreground.visible, laserLayer.visible, fxLayer.visible, stage.filters];
    stage.filters = null;
    laserLayer.visible = fxLayer.visible = false;
    setup();
    renderer.render(stage);
    var res = drawn(), err = gl.getError();
    teardown();
    container.visible = saved[0]; foreground.visible = saved[1];
    laserLayer.visible = saved[2]; fxLayer.visible = saved[3]; stage.filters = saved[4];
    dg('diag ' + name + ': drawn=' + res + ' glError=' + err);
  }
  var bgFilters = container.filters, catFilters = cat.filters;
  var onlyBg  = function() { container.visible = true;  foreground.visible = false; };
  var onlyFg  = function() { container.visible = false; foreground.visible = true;  };
  var pk = function(v) { pickles.forEach(function(p) { p.visible = v; }); };
  var none = function() {};
  trial('bg   +filters', onlyBg, none);
  trial('bg   no filter', function() { onlyBg(); container.filters = null; }, function() { container.filters = bgFilters; });
  trial('cat  +filter', function() { onlyFg(); pk(false); }, function() { pk(true); });
  trial('cat  no filter', function() { onlyFg(); pk(false); cat.filters = null; }, function() { pk(true); cat.filters = catFilters; });
  trial('pickles', function() { onlyFg(); cat.visible = false; }, function() { cat.visible = true; });
  dg('diag done');
}

function animate() {
  requestAnimationFrame(animate);
  var d = +new Date();

  d1.position.x = 200 * Math.sin(d / 1200);
  d1.position.y = 200 * Math.cos(d / 1200);
  f1.scale.x = 170 * Math.sin(d / 1100);
  f1.scale.y = 170 * Math.cos(d / 1070);
  bg.rotation  = 0.1  * Math.sin(d / 10000);
  cat.rotation = 0.04 * Math.cos(d / 1000);

  for (var i = 0; i < pickles.length; i++) {
    pickles[i].position.x = pickleX(d, i, pickles.length, w);
    pickles[i].position.y = 100 * Math.sin(i + d/5000) + 150;
    if (pickleAlive[i]) {
      pickles[i].rotation = Math.sign(i-1.5) * d / (2500+300*i);
    }
    if (!pickleAlive[i] && pickles[i].parent) {
      pickles[i].alpha = Math.min(1, pickles[i].alpha + 0.015);
      if (pickles[i].alpha >= 1) pickleAlive[i] = true;
    }
  }

  catf.scale.x = (viewSize().w/2 - mousex) / 80 + 6 * Math.sin(d/1000);
  catf.scale.y = (viewSize().h/2 - mousey) / 80 + 6 * Math.cos(d/1200);

  // LASERS
  laserLayer.removeChildren();
  var eyes = cat ? getEyePositions(cat) : [];
  for (var li = lasers.length-1; li >= 0; li--) {
    var l = lasers[li];
    if (l.done) { lasers.splice(li,1); continue; }
    if (eyes[l.eyeIdx]) { l.sx = eyes[l.eyeIdx].x; l.sy = eyes[l.eyeIdx].y; }
    l.progress = Math.min(1, l.progress + l.speed);
    var cx = l.sx + (l.tx - l.sx) * l.progress;
    var cy = l.sy + (l.ty - l.sy) * l.progress;
    if (!l.hit && checkHit(cx, cy)) { l.hit = true; l.done = true; }
    var lg = new PIXI.Graphics();
    lg.lineStyle(28, 0xff0000, 0.06); lg.moveTo(l.sx,l.sy); lg.lineTo(cx,cy);
    lg.lineStyle(14, 0xff2200, 0.18); lg.moveTo(l.sx,l.sy); lg.lineTo(cx,cy);
    lg.lineStyle(6,  0xff3300, 0.95); lg.moveTo(l.sx,l.sy); lg.lineTo(cx,cy);
    lg.lineStyle(2,  0xffffff, 0.90); lg.moveTo(l.sx,l.sy); lg.lineTo(cx,cy);
    lg.lineStyle(0);
    lg.beginFill(0xff6600,0.9); lg.drawCircle(cx,cy,8); lg.endFill();
    lg.beginFill(0xffffff, 0.9); lg.drawCircle(cx,cy,4); lg.endFill();
    laserLayer.addChild(lg);
    if (l.progress >= 1 && !l.hit) {
      for (var s = 0; s < 5; s++) {
        var sg = new PIXI.Graphics();
        sg.beginFill(0xff6600); sg.drawCircle(0,0,2+Math.random()*3); sg.endFill();
        sg.position.x = l.tx; sg.position.y = l.ty;
        var sa = Math.random()*Math.PI*2, ss = 2+Math.random()*4;
        fxLayer.addChild(sg);
        particles.push({ g:sg, vx:Math.cos(sa)*ss, vy:Math.sin(sa)*ss, gravity:0.18, life:1.0, decay:0.08, spin:0 });
      }
      l.done = true;
    }
  }

  // PARTICLES
  for (var pi = particles.length-1; pi >= 0; pi--) {
    var pt = particles[pi];
    if (pt._delay > 0) { pt._delay--; continue; }
    pt.life -= pt.decay;
    if (pt.life <= 0) { fxLayer.removeChild(pt.g); particles.splice(pi,1); continue; }
    if (pt._flash) { pt.g.scale.x = pt.g.scale.y = 1+(1-pt.life)*2.5; pt.g.alpha = pt.life*0.7; continue; }
    if (pt._ring)  { pt.g.scale.x = pt.g.scale.y = 1+(1-pt.life)*7;   pt.g.alpha = pt.life; continue; }
    pt.vx *= 0.97; pt.vy += pt.gravity;
    pt.g.position.x += pt.vx; pt.g.position.y += pt.vy;
    pt.g.rotation   += pt.spin;
    pt.g.alpha = Math.min(1, pt.life*1.4);
  }

  renderer.render(stage);
}

</script>
</body>
</html>
